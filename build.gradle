plugins {
    id 'java'
    id 'war'  
}

group = 'com.coworking'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-context:6.1.1'
    implementation 'org.springframework:spring-webmvc:6.1.1'
    implementation 'org.springframework:spring-orm:6.1.1'
    implementation 'org.springframework.data:spring-data-jpa:3.2.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.hibernate:hibernate-core:6.3.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    runtimeOnly 'com.h2database:h2:2.2.224'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.springframework:spring-test:6.1.1'
}

tasks.named('test') {
    useJUnitPlatform()
}